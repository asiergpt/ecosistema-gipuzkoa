[project]
name = "ecosistema-gipuzkoa"
version = "2.0.0"
description = "Estudio de inteligencia empresarial del ecosistema guipuzcoano"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "typer>=0.12",
    "openpyxl>=3.1",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",           # Tablas bonitas en terminal
    "thefuzz>=0.22",        # Fuzzy matching (reemplaza difflib)
    "unidecode>=1.3",       # Normalización de acentos
]

[project.optional-dependencies]
enrichment = [
    "google-genai>=1.0",    # Gemini API
    "anthropic>=0.40",      # Claude API
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "plotly>=5.22",
]

[project.scripts]
eco = "cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
